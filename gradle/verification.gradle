def validateGeneratedResources = tasks.register('validateGeneratedResources') {
    group = 'verification'
    description = 'Validates generated JSON, shaped recipe symbols, and language-key parity.'
    inputs.files(fileTree('src/generated/resources') { include '**/*.json' })
    inputs.files(fileTree('src/main/resources') { include '**/*.json' })

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def errors = []
        def resourceJson = files(
                fileTree('src/generated/resources') { include '**/*.json' },
                fileTree('src/main/resources') { include '**/*.json' })

        resourceJson.each { file ->
            try {
                slurper.parse(file)
            } catch (Exception exception) {
                errors << "${project.relativePath(file)}: invalid JSON (${exception.message})"
            }
        }

        fileTree('src/generated/resources/data') { include '**/recipes/**/*.json' }.each { file ->
            def recipe = slurper.parse(file)
            if (recipe.type == 'minecraft:crafting_shaped') {
                def usedSymbols = recipe.pattern
                        .collectMany { row -> row.toList() }
                        .findAll { symbol -> symbol != ' ' }
                        .toSet()
                def definedSymbols = recipe.key.keySet() as Set
                def undefinedSymbols = usedSymbols - definedSymbols
                def unusedSymbols = definedSymbols - usedSymbols
                if (!undefinedSymbols.isEmpty()) {
                    errors << "${project.relativePath(file)}: undefined pattern symbols ${undefinedSymbols.sort()}"
                }
                if (!unusedSymbols.isEmpty()) {
                    errors << "${project.relativePath(file)}: unused key symbols ${unusedSymbols.sort()}"
                }
            }
        }

        def enFile = file('src/generated/resources/assets/gregulvexpansion/lang/en_us.json')
        def zhFile = file('src/main/resources/assets/gregulvexpansion/lang/zh_cn.json')
        def enKeys = slurper.parse(enFile).keySet() as Set
        def zhKeys = slurper.parse(zhFile).keySet() as Set
        if (enKeys != zhKeys) {
            errors << "Language keys differ: missing zh_cn=${(enKeys - zhKeys).sort()}, extra zh_cn=${(zhKeys - enKeys).sort()}"
        }

        // A valid machine model can still render as a bare hull when its overlay path
        // points at the wrong namespace. Pin every reused/custom visual to the resource
        // it is expected to contain so datagen catches that semantic failure.
        def expectedModelReferences = [
                'models/item/ulv_electric_motor.json'                    : 'gregulvexpansion:item/ulv_electric_motor',
                'models/item/ulv_conveyor_module.json'                  : 'gregulvexpansion:item/ulv_conveyor_module',
                'models/item/ulv_electric_pump.json'                    : 'gregulvexpansion:item/ulv_electric_pump',
                'models/item/ulv_electric_piston.json'                  : 'gregulvexpansion:item/ulv_electric_piston',
                'models/item/ulv_robot_arm.json'                        : 'gregulvexpansion:item/ulv_robot_arm',
                'models/item/ulv_fluid_regulator.json'                  : 'gregulvexpansion:item/ulv_fluid_regulator',
                'models/block/machine/primitive_electrolyzer.json'      : 'gtceu:block/machines/electrolyzer/overlay_front',
                'models/block/machine/ulv_wire_mill.json'               : 'gtceu:block/machines/wiremill/overlay_front',
                'models/block/machine/ulv_cutter.json'                  : 'gtceu:block/machines/cutter/overlay_front',
                'models/block/machine/ulv_bender.json'                  : 'gtceu:block/machines/bender/overlay_front',
                'models/block/machine/ulv_lathe.json'                   : 'gtceu:block/machines/lathe/overlay_front',
                'models/block/machine/ulv_chemical_reactor.json'        : 'gtceu:block/machines/chemical_reactor/overlay_front',
                'models/block/machine/ulv_fluid_solidifier.json'        : 'gtceu:block/machines/fluid_solidifier/overlay_front',
                'models/block/machine/ulv_fluid_extractor.json'         : 'gtceu:block/machines/extractor/overlay_front',
                'models/block/machine/ulv_gas_turbine.json'             : 'gtceu:block/generators/gas_turbine/overlay_side',
                'models/block/machine/ulv_polarizer.json'               : 'gtceu:block/machines/polarizer/overlay_front',
                'models/block/machine/redstone_generator.json'          : 'gregulvexpansion:block/generators/redstone_generator/overlay_front',
                'models/block/machine/lead_chamber.json'                 : 'gtceu:block/multiblock/large_chemical_reactor/overlay_front',
                'models/block/machine/primitive_distillation_tower.json': 'gtceu:block/multiblock/distillation_tower/overlay_front',
                'models/block/machine/primitive_cracker.json'           : 'gtceu:block/multiblock/cracking_unit/overlay_front',
                'models/block/machine/ulv_fluid_drilling_rig.json'      : 'gtceu:block/multiblock/fluid_drilling_rig/overlay_front'
        ]
        def generatedAssetRoot = file('src/generated/resources/assets/gregulvexpansion')
        expectedModelReferences.each { relativePath, reference ->
            def modelFile = new File(generatedAssetRoot, relativePath)
            if (!modelFile.isFile()) {
                errors << "${project.relativePath(modelFile)}: missing generated model"
            } else if (!modelFile.getText('UTF-8').contains(reference)) {
                errors << "${project.relativePath(modelFile)}: missing visual reference ${reference}"
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Generated resource validation failed:\n - " + errors.join('\n - '))
        }
    }
}

def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks the reobfuscated release jar for required metadata and forbidden build artifacts.'
    dependsOn tasks.named('reobfJar')
    def archiveFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archiveFile)

    doLast {
        def archive = archiveFile.get().asFile
        def requiredEntries = [
                'META-INF/MANIFEST.MF',
                'META-INF/mods.toml',
                "LICENSE_${mod_id}.txt",
                "LICENSE-ASSETS_${mod_id}.txt",
                "CREDITS_${mod_id}.txt"
        ] as Set

        new java.util.jar.JarFile(archive).withCloseable { jarFile ->
            def entries = java.util.Collections.list(jarFile.entries())*.name as Set
            def missingEntries = requiredEntries - entries
            def forbiddenEntries = entries.findAll { it == '.cache' || it.startsWith('.cache/') }
            if (!missingEntries.isEmpty() || !forbiddenEntries.isEmpty()) {
                throw new GradleException(
                        "Release jar validation failed: missing=${missingEntries.sort()}, " +
                                "forbidden=${forbiddenEntries.sort()}")
            }

            def attributes = jarFile.manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != mod_version) {
                throw new GradleException(
                        "Release jar version mismatch: expected ${mod_version}, " +
                                "found ${attributes.getValue('Implementation-Version')}")
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn validateGeneratedResources, verifyReleaseJar
}

// Forge can exit successfully when no tests were discovered. Make the Gradle
// task prove that this addon's required GameTests actually ran and passed.
tasks.matching { it.name == 'runGameTestServer' }.configureEach { gameTestTask ->
    doFirst {
        gameTestTask.ext.gameplayStartedAt = System.currentTimeMillis()
    }
    doLast {
        def log = file('build/gametest/logs/latest.log')
        def body = log.isFile() ? log.getText('UTF-8') : ''
        if (!log.isFile() || log.lastModified() < gameTestTask.ext.gameplayStartedAt ||
                !(body =~ /[1-9][0-9]* GAME TESTS COMPLETE/) ||
                !(body =~ /All [1-9][0-9]* required tests passed/)) {
            throw new GradleException(
                    'GameTest did not complete successfully; inspect build/gametest/logs/latest.log')
        }
        def report = file('build/reports/gametest.txt')
        report.parentFile.mkdirs()
        report.setText(body.readLines().findAll {
            it.contains('GAME TESTS COMPLETE') || it.contains('required tests passed')
        }.join('\n') + '\n', 'UTF-8')
    }
}
