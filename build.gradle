plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            // GTCEu development jars carry production refmaps. All
            // ForgeGradle run types, including data generation, must remap them.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing-mod', 'gtceu'
        }
    }
}

// The config line registers the (currently empty) mixin config for
// development runs; future mixins against GTCEu classes will use remap = false
// and need no refmap, mirroring the sibling steam project's build.
mixin {
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // Registrate writes incremental datagen state here. It is build metadata,
    // not a runtime resource, and must not leak into the published mod jar.
    exclude '.cache/**'
}

repositories {
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    gtceuEmbedded
}

def embeddedDependencyDir = layout.buildDirectory.dir('embedded-dependencies')
// Track the embedded jars as inputs and remove stale versions after GTCEu upgrades.
def extractGtceuEmbeddedDependencies = tasks.register('extractGtceuEmbeddedDependencies', Sync) {
    from({ zipTree(configurations.gtceuEmbedded.singleFile) }) {
        include 'META-INF/jarjar/ldlib-forge-*.jar'
        include 'META-INF/jarjar/Registrate-*.jar'
        // MixinExtras is jar-jarred by GTCEu (nested inside its Forge wrapper
        // jar) and self-registers at runtime, so our mixins may use its
        // injection helpers without bundling another copy. Extract the inner
        // core jar as the compile classpath entry.
        include 'META-INF/jarjar/mixinextras-forge-*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    from({ zipTree(zipTree(configurations.gtceuEmbedded.singleFile)
            .matching { include 'META-INF/jarjar/mixinextras-forge-*.jar' }.singleFile) }) {
        include 'META-INF/jars/MixinExtras-*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into embeddedDependencyDir
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MixinGradle wires the refmap for our mixin config; the annotation
    // processor itself must be declared explicitly.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras on the processor path lets the Mixin AP see (and refmap)
    // handler methods that use its injection annotations.
    annotationProcessor files(embeddedDependencyDir.map { it.file('MixinExtras-0.5.3.jar') })

    // GregTech CEu Modern is a required common dependency. The full artifact
    // contains the libraries that GTCEu publishes as Jar-in-Jar dependencies.
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}")
    gtceuEmbedded("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") {
        transitive = false
    }

    // GTCEu embeds LDLib at runtime but does not expose it transitively to
    // addons. Extract its exact embedded copy for the addon compile classpath.
    compileOnly files(embeddedDependencyDir.map { it.file("ldlib-forge-${minecraft_version}-1.0.40.b.jar") })
    compileOnly files(embeddedDependencyDir.map { it.file('Registrate-MC1.20-1.3.11.jar') })
    compileOnly files(embeddedDependencyDir.map { it.file('MixinExtras-0.5.3.jar') })

    // The mod is required on dedicated servers too, so development server
    // runs must be able to boot. Client-only dev aids (EMI, JECh, Modern UI)
    // crash or pollute dedicated-server validation; mount all optional test
    // tools only when the invocation targets a client run.
    def mountClientDevAids = gradle.startParameter.taskNames.any { it.toLowerCase().contains('client') }

    // EMI is only a development runtime aid for browsing content in test clients.
    // It is never required at runtime and stays mounted only in client dev runs.
    if (mountClientDevAids) {
        runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    }

    // Jade is a development runtime aid for inspecting machines in client runs.
    // It remains optional for published builds and is not declared in mods.toml.
    if (mountClientDevAids) {
        runtimeOnly(fg.deobf("curse.maven:jade-324717:${jade_file_id}")) { transitive = false }
    }

    // JECh adds Chinese pinyin matching to search fields in the development client.
    // It is client-only tooling and is not included in published artifacts.
    if (mountClientDevAids) {
        runtimeOnly(fg.deobf("curse.maven:just-enough-characters-250702:${jech_file_id}")) {
            transitive = false
        }
    }

    // Sophisticated Backpacks / Storage plus their prerequisites (Puzzles Lib,
    // Sophisticated Core) exist only so the test client can exercise machine
    // container checks against placeable backpacks and storage containers
    // in-game. They are not dependencies of the addon and are not declared in
    // mods.toml.
    if (mountClientDevAids) {
        runtimeOnly(fg.deobf("curse.maven:puzzles-lib-495476:${puzzles_file_id}")) { transitive = false }
        runtimeOnly(fg.deobf("curse.maven:sophisticated-core-618298:${sophisticated_core_file_id}")) { transitive = false }
        runtimeOnly(fg.deobf("curse.maven:sophisticated-backpacks-422301:${sophisticated_backpacks_file_id}")) { transitive = false }
        runtimeOnly(fg.deobf("curse.maven:sophisticated-storage-619320:${sophisticated_storage_file_id}")) { transitive = false }
    }

    // Modern UI re-skins vanilla and modded GUIs in the development client so
    // machine screens can be checked under a global UI overhaul. It is not a
    // dependency of the addon and is not declared in mods.toml. Its client
    // bootstrap touches the window during mod construction, so it is only
    // mounted for client runs (see mountClientDevAids above).
    if (mountClientDevAids) {
        runtimeOnly(fg.deobf("curse.maven:modern-ui-352491:${modernui_file_id}")) { transitive = false }
    }

    // GTM Things mounts third-party GTCEu addon machines in the development
    // client for cross-addon checks (recipe viewers, Jade, appearance overlap
    // with this addon's machines). Its mods.toml hard-requires AE2 >= 15.4.2,
    // and this AE2 version requires GuideME >= 20.1.7. CurseMaven does not
    // resolve these mod dependencies automatically. All three stay
    // development-only and are not declared in mods.toml.
    if (mountClientDevAids) {
        runtimeOnly(fg.deobf("curse.maven:applied-energistics-2-223794:${ae2_file_id}")) { transitive = false }
        runtimeOnly(fg.deobf("curse.maven:guideme-1173950:${guideme_file_id}")) { transitive = false }
        runtimeOnly(fg.deobf("curse.maven:gtmthings-1104310:${gtmthings_file_id}")) { transitive = false }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')

    // Client mixins would need the refmap the Mixin annotation processor
    // writes next to the compile output; the copy is a no-op while the
    // mixin config ships empty.
    from("${buildDir}/tmp/compileJava/compileJava-refmap.json") {
        rename { "${mod_id}.refmap.json" }
    }

    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            gtceu_version_range    : gtceu_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE.txt') {
        rename { "LICENSE_${mod_id}.txt" }
    }
    from('LICENSE-ASSETS.txt') {
        rename { "LICENSE-ASSETS_${mod_id}.txt" }
    }
    from('CREDITS.txt') {
        rename { "CREDITS_${mod_id}.txt" }
    }

    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : mod_name,
                'Implementation-Version'   : archiveVersion.get(),
                'Implementation-Vendor'    : mod_authors,
                'MixinConfigs'             : "${mod_id}.mixins.json"
        ])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractGtceuEmbeddedDependencies
    options.encoding = 'UTF-8'
    options.release = 17
}

// The Mixin annotation processor writes the refmap as a side file that is
// not part of compileJava's cached outputs; a build-cache hit would restore
// classes without re-running the AP, so this task must never be cached.
tasks.named('compileJava').configure {
    outputs.cacheIf { false }
}

def validateGeneratedResources = tasks.register('validateGeneratedResources') {
    group = 'verification'
    description = 'Validates generated JSON, shaped recipe symbols, and language-key parity.'
    inputs.files(fileTree('src/generated/resources') { include '**/*.json' })
    inputs.files(fileTree('src/main/resources') { include '**/*.json' })

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def errors = []
        def resourceJson = files(
                fileTree('src/generated/resources') { include '**/*.json' },
                fileTree('src/main/resources') { include '**/*.json' })

        resourceJson.each { file ->
            try {
                slurper.parse(file)
            } catch (Exception exception) {
                errors << "${project.relativePath(file)}: invalid JSON (${exception.message})"
            }
        }

        fileTree('src/generated/resources/data') { include '**/recipes/**/*.json' }.each { file ->
            def recipe = slurper.parse(file)
            if (recipe.type == 'minecraft:crafting_shaped') {
                def usedSymbols = recipe.pattern
                        .collectMany { row -> row.toList() }
                        .findAll { symbol -> symbol != ' ' }
                        .toSet()
                def definedSymbols = recipe.key.keySet() as Set
                def undefinedSymbols = usedSymbols - definedSymbols
                def unusedSymbols = definedSymbols - usedSymbols
                if (!undefinedSymbols.isEmpty()) {
                    errors << "${project.relativePath(file)}: undefined pattern symbols ${undefinedSymbols.sort()}"
                }
                if (!unusedSymbols.isEmpty()) {
                    errors << "${project.relativePath(file)}: unused key symbols ${unusedSymbols.sort()}"
                }
            }
        }

        def enFile = file('src/generated/resources/assets/gregulvexpansion/lang/en_us.json')
        def zhFile = file('src/main/resources/assets/gregulvexpansion/lang/zh_cn.json')
        def enKeys = slurper.parse(enFile).keySet() as Set
        def zhKeys = slurper.parse(zhFile).keySet() as Set
        if (enKeys != zhKeys) {
            errors << "Language keys differ: missing zh_cn=${(enKeys - zhKeys).sort()}, extra zh_cn=${(zhKeys - enKeys).sort()}"
        }

        // A valid machine model can still render as a bare hull when its overlay path
        // points at the wrong namespace. Pin every reused/custom visual to the resource
        // it is expected to contain so datagen catches that semantic failure.
        def expectedModelReferences = [
                'models/item/ulv_electric_motor.json'                    : 'gregulvexpansion:item/ulv_electric_motor',
                'models/item/ulv_conveyor_module.json'                  : 'gregulvexpansion:item/ulv_conveyor_module',
                'models/item/ulv_electric_pump.json'                    : 'gregulvexpansion:item/ulv_electric_pump',
                'models/item/ulv_electric_piston.json'                  : 'gregulvexpansion:item/ulv_electric_piston',
                'models/item/ulv_robot_arm.json'                        : 'gregulvexpansion:item/ulv_robot_arm',
                'models/item/ulv_fluid_regulator.json'                  : 'gregulvexpansion:item/ulv_fluid_regulator',
                'models/block/machine/primitive_electrolyzer.json'      : 'gtceu:block/machines/electrolyzer/overlay_front',
                'models/block/machine/ulv_wire_mill.json'               : 'gtceu:block/machines/wiremill/overlay_front',
                'models/block/machine/ulv_cutter.json'                  : 'gtceu:block/machines/cutter/overlay_front',
                'models/block/machine/ulv_bender.json'                  : 'gtceu:block/machines/bender/overlay_front',
                'models/block/machine/ulv_lathe.json'                   : 'gtceu:block/machines/lathe/overlay_front',
                'models/block/machine/ulv_chemical_reactor.json'        : 'gtceu:block/machines/chemical_reactor/overlay_front',
                'models/block/machine/ulv_fluid_solidifier.json'        : 'gtceu:block/machines/fluid_solidifier/overlay_front',
                'models/block/machine/ulv_fluid_extractor.json'         : 'gtceu:block/machines/extractor/overlay_front',
                'models/block/machine/ulv_gas_turbine.json'             : 'gtceu:block/generators/gas_turbine/overlay_side',
                'models/block/machine/ulv_polarizer.json'               : 'gtceu:block/machines/polarizer/overlay_front',
                'models/block/machine/redstone_generator.json'          : 'gregulvexpansion:block/generators/redstone_generator/overlay_front',
                'models/block/machine/lead_chamber.json'                 : 'gtceu:block/multiblock/large_chemical_reactor/overlay_front',
                'models/block/machine/primitive_distillation_tower.json': 'gtceu:block/multiblock/distillation_tower/overlay_front',
                'models/block/machine/primitive_cracker.json'           : 'gtceu:block/multiblock/pyrolyse_oven/overlay_front',
                'models/block/machine/ulv_fluid_drilling_rig.json'      : 'gtceu:block/multiblock/fluid_drilling_rig/overlay_front'
        ]
        def generatedAssetRoot = file('src/generated/resources/assets/gregulvexpansion')
        expectedModelReferences.each { relativePath, reference ->
            def modelFile = new File(generatedAssetRoot, relativePath)
            if (!modelFile.isFile()) {
                errors << "${project.relativePath(modelFile)}: missing generated model"
            } else if (!modelFile.getText('UTF-8').contains(reference)) {
                errors << "${project.relativePath(modelFile)}: missing visual reference ${reference}"
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Generated resource validation failed:\n - " + errors.join('\n - '))
        }
    }
}

def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks the reobfuscated release jar for required metadata and forbidden build artifacts.'
    dependsOn tasks.named('reobfJar')
    def archiveFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archiveFile)

    doLast {
        def archive = archiveFile.get().asFile
        def requiredEntries = [
                'META-INF/MANIFEST.MF',
                'META-INF/mods.toml',
                "LICENSE_${mod_id}.txt",
                "LICENSE-ASSETS_${mod_id}.txt",
                "CREDITS_${mod_id}.txt"
        ] as Set

        new java.util.jar.JarFile(archive).withCloseable { jarFile ->
            def entries = java.util.Collections.list(jarFile.entries())*.name as Set
            def missingEntries = requiredEntries - entries
            def forbiddenEntries = entries.findAll { it == '.cache' || it.startsWith('.cache/') }
            if (!missingEntries.isEmpty() || !forbiddenEntries.isEmpty()) {
                throw new GradleException(
                        "Release jar validation failed: missing=${missingEntries.sort()}, " +
                                "forbidden=${forbiddenEntries.sort()}")
            }

            def attributes = jarFile.manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != mod_version) {
                throw new GradleException(
                        "Release jar version mismatch: expected ${mod_version}, " +
                                "found ${attributes.getValue('Implementation-Version')}")
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn validateGeneratedResources, verifyReleaseJar
}
